        <svg {...props} fill="currentColor" viewBox="0 0 24 24">
          <path d="M.057 24l1.687-6.163c-1.041-1.804-1.588-3.849-1.587-5.946.003-6.556 5.338-11.891 11.893-11.891 3.181.001 6.167 1.24 8.413 3.488 2.245 2.248 3.481 5.236 3.48 8.414-.003 6.557-5.338 11.892-11.893 11.892-1.99-.001-3.951-.5-5.688-1.448l-6.305 1.654zm6.597-3.807c1.676.995 3.276 1.591 5.392 1.592 5.448 0 9.886-4.434 9.889-9.885.002-5.462-4.415-9.89-9.881-9.892-5.452 0-9.887 4.434-9.889 9.884-.001 2.225.651 3.891 1.746 5.634l-.999 3.648 3.742-.981zm11.387-5.464c-.074-.124-.272-.198-.57-.347-.297-.149-1.758-.868-2.031-.967-.272-.099-.47-.149-.669.149-.198.297-.768.967-.941 1.165-.173.198-.347.223-.644.074-.297-.149-1.255-.462-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.297-.347.446-.521.151-.172.2-.296.3-.495.099-.198.05-.372-.025-.521-.075-.148-.669-1.611-.916-2.206-.242-.579-.487-.501-.669-.51l-.57-.01c-.198 0-.52.074-.792.372s-1.04 1.016-1.04 2.479 1.065 2.876 1.213 3.074c.149.198 2.095 3.2 5.076 4.487.709.306 1.263.489 1.694.626.712.226 1.36.194 1.872.118.571-.085 1.758-.719 2.006-1.413.248-.695.248-1.29.173-1.414z"/>

      Bag: (props) => <svg {...props} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"/></svg>,
      Close: (props) => <svg {...props} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M6 18L18 6M6 6l12 12"/></svg>,
      Check: (props) => <svg {...props} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.5" d="M5 13l4 4L19 7"/></svg>,
      Location: (props) => <svg {...props} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"/></svg>,
      Truck: (props) => <svg {...props} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M13 16V6a1 1 0 00-1-1H4a1 1 0 00-1 1v10a1 1 0 001 1h1m8-1a1 1 0 01-1 1H9m4-1V8a1 1 0 011-1h2.586a1 1 0 01.707.293l3.414 3.414a1 1 0 01.293.707V16a1 1 0 01-1 1h-1m-6-1a1 1 0 001 1h1M5 17a2 2 0 104 0m-4 0a2 2 0 114 0m6 0a2 2 0 104 0m-4 0a2 2 0 114 0"/></svg>,
      Heart: ({ filled, ...props }) => <svg {...props} fill={filled ? "#F5BE18" : "none"} stroke={filled ? "#F5BE18" : "currentColor"} viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"/></svg>,
      Star: (props) => <svg {...props} fill="currentColor" viewBox="0 0 20 20"><path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"/></svg>,
    };

    function App() {
      const [products] = useState(window.PRODUCTS_DATA || []);
      const [cart, setCart] = useState([]);
      const [cartOpen, setCartOpen] = useState(false);
      const [wishlist, setWishlist] = useState([]);
      const [quickViewProduct, setQuickViewProduct] = useState(null);
      const [checkoutOpen, setCheckoutOpen] = useState(false);
      const [searchQuery, setSearchQuery] = useState("");
      const [selectedCategory, setSelectedCategory] = useState("All");
      const [toast, setToast] = useState(null);

      const showToast = (msg) => {
        setToast(msg);
        setTimeout(() => setToast(null), 3500);
      };

      const addToCart = (product, size) => {
        const chosenSize = size || product.sizes[0];
        setCart(prev => {
          const item = prev.find(i => i.product.id === product.id && i.size === chosenSize);
          if (item) {
            return prev.map(i => i === item ? { ...i, qty: i.qty + 1 } : i);
          }
          return [...prev, { product, size: chosenSize, qty: 1 }];
        });
        showToast(`Added ${product.name} (${chosenSize}) to cart`);
        setCartOpen(true);
      };

      const updateQty = (idx, delta) => {
        setCart(prev => {
          const next = [...prev];
          const newQty = next[idx].qty + delta;
          if (newQty <= 0) next.splice(idx, 1);
          else next[idx].qty = newQty;
          return next;
        });
      };

      const cartTotal = cart.reduce((acc, i) => acc + (i.product.price * i.qty), 0);
      const cartItemsCount = cart.reduce((acc, i) => acc + i.qty, 0);

      const filtered = useMemo(() => {
        return products.filter(p => {
          if (searchQuery.trim() !== "") {
            const q = searchQuery.toLowerCase();
            if (!p.name.toLowerCase().includes(q) && !p.category.toLowerCase().includes(q)) return false;
          }
          if (selectedCategory !== "All" && p.category !== selectedCategory) return false;
          return true;
        });
      }, [products, searchQuery, selectedCategory]);

      // Direct WhatsApp Order link builder
      const openWhatsAppOrder = (itemOrList) => {
        let msg = `Hello Aura Outfit (@aura_outfit._)!\nI would like to place an order from your website:\n\n`;
        if (Array.isArray(itemOrList)) {
          itemOrList.forEach((it, idx) => {
            msg += `${idx + 1}. ${it.product.name} (Size: ${it.size}) x ${it.qty} = ₹${it.product.price * it.qty}\n`;
          });
          msg += `\n*Total Amount:* ₹${cartTotal}\n*Location for Courier Delivery:* [Please enter your City/Pincode]`;
        } else {
          msg += `*Item:* ${itemOrList.name}\n*Price:* ₹${itemOrList.price}\n*Size Required:* ${itemOrList.sizes[0]}\n*Delivery Destination:* [Enter your City]`;
        }
        window.open(`https://wa.me/${WHATSAPP_PHONE}?text=${encodeURIComponent(msg)}`, '_blank');
      };

      return (
        <div className="min-h-screen bg-dark-950 text-neutral-100 flex flex-col font-sans">
          
          {/* Toast */}
          {toast && (
            <div className="fixed bottom-6 right-6 z-50 bg-dark-850 border border-brand-yellow text-white px-5 py-3 rounded-lg shadow-2xl flex items-center gap-3 animate-bounce">
              <span className="w-2.5 h-2.5 rounded-full bg-brand-yellow"></span>
              <p className="text-xs font-semibold">{toast}</p>
            </div>
          )}

          {/* Top Instagram & WhatsApp Urgent Alert Bar */}
          <div className="bg-gradient-to-r from-purple-900 via-dark-900 to-green-900 py-2.5 px-4 text-xs font-medium text-neutral-200 border-b border-white/10 flex flex-wrap items-center justify-between gap-3">
            <div className="flex items-center gap-2 mx-auto sm:mx-0">
              <span className="bg-brand-accent text-white text-[10px] uppercase font-black px-2 py-0.5 rounded animate-pulse">🔥 MEGA DEAL</span>
              <span>1 Shirt + 1 Baggy Pant for just <strong className="text-brand-yellow font-bold">₹999</strong> only!</span>
            </div>
            <div className="flex items-center gap-4 mx-auto sm:mx-0 text-[11px]">
              <a 
                href={INSTAGRAM_URL} 
                target="_blank" 
                rel="noreferrer"
                className="flex items-center gap-1.5 text-pink-400 hover:text-pink-300 font-semibold"
              >
                <Icon.Instagram className="w-4 h-4" />
                @aura_outfit._
              </a>
              <span className="text-neutral-500">|</span>
              <a 
                href={`https://wa.me/${WHATSAPP_PHONE}?text=Hi%20Aura%20Outfit!%20I%20have%20an%20inquiry.`}
                target="_blank" 
                rel="noreferrer"
                className="flex items-center gap-1.5 text-green-400 hover:text-green-300 font-semibold"
              >
                <Icon.WhatsApp className="w-4 h-4" />
                WhatsApp: 93605 53223
              </a>
            </div>
          </div>

          {/* Main Navigation */}
          <header className="sticky top-0 z-40 bg-dark-950/90 backdrop-blur-md border-b border-white/10">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 h-20 flex items-center justify-between">
              
              {/* Brand Logo */}
              <div className="flex items-center gap-6">
                <a href="#" className="flex flex-col">
                  <div className="flex items-center gap-2">
                    <span className="font-extrabold text-2xl sm:text-3xl tracking-tighter text-white font-heading">
                      AURA<span className="text-brand-yellow">.</span>OUTFIT
                    </span>
                    <span className="bg-brand-yellow text-black text-[9px] font-black uppercase px-1.5 py-0.5 rounded">MENS WEAR</span>
                  </div>
                  <span className="text-[10px] tracking-widest text-neutral-400 uppercase">PG Palayam • Salem • All India Delivery</span>
                </a>
              </div>

              {/* Navigation Categories */}
              <nav className="hidden md:flex items-center space-x-6 text-xs uppercase tracking-wider font-semibold">
                {["All", "Combo Offers", "Baggy & Cargo Pants", "Shirts", "Oversized T-Shirts", "Formal & Checked Pants"].map(cat => (
                  <button
                    key={cat}
                    onClick={() => setSelectedCategory(cat)}
                    className={`py-1 transition-colors ${selectedCategory === cat ? 'text-brand-yellow border-b-2 border-brand-yellow' : 'text-neutral-300 hover:text-white'}`}
                  >
                    {cat}
                  </button>
                ))}
              </nav>

              {/* Actions */}
              <div className="flex items-center gap-4">
                <div className="relative hidden sm:block w-48">
                  <input
                    type="text"
                    value={searchQuery}
                    onChange={(e) => setSearchQuery(e.target.value)}
                    placeholder="Search cargos, combos..."
                    className="w-full bg-dark-900 border border-neutral-800 focus:border-brand-yellow rounded-full px-3.5 py-1.5 pl-8 text-xs text-white focus:outline-none"
                  />
                  <Icon.Search className="w-3.5 h-3.5 text-neutral-400 absolute left-3 top-2.5" />
                </div>

                {/* Direct WhatsApp Quick Contact */}
                <a
                  href={`https://wa.me/${WHATSAPP_PHONE}?text=Hi%20Aura%20Outfit,%20I%20am%20visiting%20your%20website%20and%20want%20to%20order.`}
                  target="_blank"
                  rel="noreferrer"
                  className="bg-brand-green hover:bg-emerald-600 text-black font-bold px-3 py-1.5 rounded-full text-xs flex items-center gap-1.5 transition-transform hover:scale-105"
                  title="WhatsApp Direct Chat"
                >
                  <Icon.WhatsApp className="w-4 h-4 fill-black" />
                  <span className="hidden sm:inline">WhatsApp Order</span>
                </a>

                {/* Shopping Bag Button */}
                <button
                  onClick={() => setCartOpen(true)}
                  className="relative p-2 text-neutral-300 hover:text-brand-yellow transition-colors flex items-center gap-2"
                >
                  <Icon.Bag className="w-6 h-6" />
                  {cartItemsCount > 0 && (
                    <span className="absolute -top-1 -right-1 bg-brand-yellow text-black font-black text-[10px] w-4 h-4 rounded-full flex items-center justify-center">
                      {cartItemsCount}
                    </span>
                  )}
                </button>
              </div>

            </div>
          </header>

          {/* Hero Section with Official Instagram Feed Vibe */}
          <section className="relative overflow-hidden bg-gradient-to-b from-dark-900 to-dark-950 border-b border-white/10 py-16 sm:py-24">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 relative z-10 flex flex-col md:flex-row items-center justify-between gap-10">
              
              <div className="max-w-2xl text-center md:text-left">
                <div className="inline-flex items-center gap-2 bg-purple-900/40 border border-purple-500/30 px-3 py-1 rounded-full text-xs text-pink-300 font-semibold mb-4">
                  <Icon.Instagram className="w-3.5 h-3.5 text-pink-400" />
                  Official Store for @aura_outfit._
                </div>
                <h1 className="text-4xl sm:text-6xl font-black font-heading tracking-tight leading-none text-white">
                  TRENDING MEN'S <br />
                  <span className="text-brand-yellow">STREETWEAR & COMBOS</span>
                </h1>
                <p className="mt-4 text-neutral-300 text-sm sm:text-base font-normal max-w-xl">
                  Baggy Cargos, Korean Textured Shirts, Heavyweight Drop-Shoulder Tees & Formal Stretch Lycra Pants. Handpicked export quality at unbelievable local wholesale prices.
                </p>

                <div className="mt-8 flex flex-wrap gap-4 justify-center md:justify-start">
                  <a
                    href="#catalog"
                    className="bg-brand-yellow hover:bg-yellow-400 text-black font-black uppercase tracking-wider text-xs px-8 py-3.5 rounded shadow-lg shadow-brand-yellow/20 transition-all"
                  >
                    Shop Trending Catalog
                  </a>
                  <a
                    href={INSTAGRAM_URL}
                    target="_blank"
                    rel="noreferrer"
                    className="border border-pink-500/50 hover:bg-pink-950/40 text-pink-300 font-bold uppercase tracking-wider text-xs px-6 py-3.5 rounded flex items-center gap-2 transition-all"
                  >
                    <Icon.Instagram className="w-4 h-4" />
                    Follow @aura_outfit._
                  </a>
                </div>

                {/* Features Pills */}
                <div className="mt-8 pt-6 border-t border-white/10 grid grid-cols-2 sm:grid-cols-3 gap-4 text-xs text-neutral-400">
                  <div className="flex items-center gap-2">
                    <Icon.Truck className="w-4 h-4 text-brand-yellow" />
                    <span>Pan-India Courier</span>
                  </div>
                  <div className="flex items-center gap-2">
                    <Icon.Check className="w-4 h-4 text-brand-yellow" />
                    <span>COD Available</span>
                  </div>
                  <div className="flex items-center gap-2">
                    <Icon.Location className="w-4 h-4 text-brand-yellow" />
                    <span>Salem PG Palayam Store</span>
                  </div>
                </div>
              </div>

              {/* Promo Banner Card */}
              <div className="w-full md:w-96 bg-dark-900 border-2 border-brand-yellow/80 rounded-2xl p-6 shadow-2xl relative overflow-hidden">
                <span className="absolute -right-12 -top-8 bg-brand-accent text-white font-black text-[11px] uppercase tracking-wider px-14 py-3 rotate-45 shadow">
                  HOT DEAL
                </span>
                <span className="text-xs uppercase font-extrabold text-brand-yellow tracking-widest">Viral Special Offer</span>
                <h3 className="text-2xl font-black font-heading mt-1 text-white">SHIRT + CARGO PANT</h3>
                <div className="mt-3 flex items-baseline gap-3">
                  <span className="text-4xl font-extrabold text-white">₹999</span>
                  <span className="text-neutral-500 line-through text-lg">₹1,599</span>
                  <span className="text-xs bg-emerald-950 text-emerald-400 border border-emerald-500/40 px-2 py-0.5 rounded font-bold">SAVE ₹600</span>
                </div>
                <p className="text-xs text-neutral-400 mt-2 font-light">
                  Pick any premium Korean or linen shirt paired with 6-pocket wide leg cargo pants.
                </p>
                <button
                  onClick={() => addToCart(products[0])}
                  className="mt-5 w-full bg-brand-yellow hover:bg-yellow-400 text-black font-extrabold py-3 text-xs uppercase tracking-wider rounded transition-colors"
                >
                  Grab ₹999 Combo Now
                </button>
              </div>

            </div>
          </section>

          {/* Product Catalog */}
          <main id="catalog" className="max-w-7xl mx-auto px-4 sm:px-6 py-14 flex-1 w-full">
            
            {/* Category Filter Pills */}
            <div className="flex items-center justify-between flex-wrap gap-4 mb-8">
              <div>
                <span className="text-xs font-black uppercase text-brand-yellow tracking-widest">Aura Outfit Collection</span>
                <h2 className="text-2xl sm:text-3xl font-black font-heading text-white">Fresh Drops & Best Sellers ({filtered.length})</h2>
              </div>

              <div className="flex items-center gap-2 overflow-x-auto pb-2 max-w-full">
                {["All", "Combo Offers", "Baggy & Cargo Pants", "Shirts", "Oversized T-Shirts", "Formal & Checked Pants"].map(cat => (
                  <button
                    key={cat}
                    onClick={() => setSelectedCategory(cat)}
                    className={`text-xs px-4 py-2 rounded-full whitespace-nowrap font-bold transition-all ${
                      selectedCategory === cat 
                        ? 'bg-brand-yellow text-black' 
                        : 'bg-dark-900 text-neutral-400 hover:text-white border border-neutral-800'
                    }`}
                  >
                    {cat}
                  </button>
                ))}
              </div>
            </div>

            {/* Grid */}
            <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
              {filtered.map(product => (
                <div 
                  key={product.id}
                  className="group bg-dark-900 border border-neutral-800 rounded-xl overflow-hidden hover:border-brand-yellow/60 transition-all duration-300 flex flex-col justify-between"
                >
                  {/* Image */}
                  <div className="relative aspect-product overflow-hidden bg-dark-950">
                    <img 
                      src={product.images[0]} 
                      alt={product.name}
                      className="w-full h-full object-cover object-top group-hover:scale-105 transition-transform duration-500"
                    />

                    {/* Badge */}
                    {product.badge && (
                      <span className="absolute top-3 left-3 bg-brand-yellow text-black text-[10px] font-black uppercase px-2.5 py-1 rounded shadow">
                        {product.badge}
                      </span>
                    )}

                    {/* Quick View Button */}
                    <button
                      onClick={() => setQuickViewProduct(product)}
                      className="absolute inset-x-3 bottom-3 bg-dark-950/90 hover:bg-brand-yellow hover:text-black text-white text-xs font-bold uppercase py-2.5 rounded opacity-0 group-hover:opacity-100 transition-opacity backdrop-blur-sm"
                    >
                      Quick View Details
                    </button>
                  </div>

                  {/* Info */}
                  <div className="p-4 flex-1 flex flex-col justify-between">
                    <div>
                      <div className="flex items-center justify-between text-[11px] text-neutral-400 mb-1">
                        <span className="uppercase tracking-wider">{product.category}</span>
                        <div className="flex items-center gap-1 text-brand-yellow font-bold">
                          <Icon.Star className="w-3 h-3" />
                          <span>{product.rating}</span>
                        </div>
                      </div>

                      <h3 
                        onClick={() => setQuickViewProduct(product)}
                        className="text-base font-bold text-white hover:text-brand-yellow cursor-pointer line-clamp-1"
                      >
                        {product.name}
                      </h3>

                      <p className="text-xs text-neutral-400 line-clamp-1 mt-1 font-light">
                        {product.fabric}
                      </p>
                    </div>

                    <div className="mt-4 pt-3 border-t border-neutral-800 flex items-center justify-between">
                      <div>
                        <div className="flex items-baseline gap-2">
                          <span className="text-lg font-black text-brand-yellow">₹{product.price}</span>
                          {product.originalPrice && (
                            <span className="text-xs text-neutral-500 line-through">₹{product.originalPrice}</span>
                          )}
                        </div>
                      </div>

                      {/* Available Sizes Tag */}
                      <span className="text-[10px] bg-dark-800 text-neutral-300 px-2 py-0.5 rounded font-mono">
                        {product.sizes.slice(0, 3).join(", ")}
                      </span>
                    </div>

                    {/* Action buttons */}
                    <div className="mt-3 grid grid-cols-2 gap-2">
                      <button
                        onClick={() => addToCart(product)}
                        className="bg-dark-800 hover:bg-dark-700 text-white font-bold text-xs py-2 rounded transition-colors"
                      >
                        + Add to Bag
                      </button>
                      <button
                        onClick={() => openWhatsAppOrder(product)}
                        className="bg-brand-green hover:bg-emerald-600 text-black font-bold text-xs py-2 rounded flex items-center justify-center gap-1 transition-colors"
                        title="Direct WhatsApp Order"
                      >
                        <Icon.WhatsApp className="w-3.5 h-3.5 fill-black" />
                        Order
                      </button>
                    </div>
                  </div>
                </div>
              ))}
            </div>
          </main>

          {/* Quick View Modal */}
          {quickViewProduct && (
            <div className="fixed inset-0 z-50 overflow-y-auto bg-black/80 backdrop-blur-md flex items-center justify-center p-4">
              <div className="bg-dark-900 border border-neutral-800 rounded-2xl max-w-3xl w-full overflow-hidden shadow-2xl relative flex flex-col md:flex-row">
                <button
                  onClick={() => setQuickViewProduct(null)}
                  className="absolute top-4 right-4 z-10 p-2 rounded-full bg-dark-950 text-neutral-400 hover:text-white"
                >
                  <Icon.Close className="w-5 h-5" />
                </button>

                <div className="md:w-1/2 aspect-product bg-dark-950">
                  <img 
                    src={quickViewProduct.images[0]} 
                    alt={quickViewProduct.name}
                    className="w-full h-full object-cover object-top"
                  />
                </div>

                <div className="md:w-1/2 p-6 flex flex-col justify-between">
                  <div>
                    <span className="text-[10px] uppercase font-bold text-brand-yellow tracking-widest">{quickViewProduct.category}</span>
                    <h3 className="text-2xl font-black font-heading text-white mt-1">{quickViewProduct.name}</h3>
                    
                    <div className="flex items-baseline gap-3 mt-2">
                      <span className="text-2xl font-extrabold text-brand-yellow">₹{quickViewProduct.price}</span>
                      {quickViewProduct.originalPrice && (
                        <span className="text-neutral-500 line-through">₹{quickViewProduct.originalPrice}</span>
                      )}
                    </div>

                    <p className="text-xs text-neutral-300 mt-4 leading-relaxed font-light">
                      {quickViewProduct.description}
                    </p>

                    <div className="mt-4 p-3 bg-dark-850 rounded-lg text-xs border border-white/5">
                      <strong className="text-white block mb-0.5">Fabric & Details:</strong>
                      <span className="text-neutral-300">{quickViewProduct.fabric}</span>
                    </div>

                    {/* Sizes */}
                    <div className="mt-4">
                      <label className="text-xs font-bold uppercase text-neutral-400 block mb-2">Available Sizes:</label>
                      <div className="flex flex-wrap gap-2">
                        {quickViewProduct.sizes.map(sz => (
                          <button
                            key={sz}
                            onClick={() => {
                              addToCart(quickViewProduct, sz);
                              setQuickViewProduct(null);
                            }}
                            className="px-3 py-1.5 border border-neutral-700 hover:border-brand-yellow text-xs rounded text-neutral-200 hover:bg-neutral-800 font-bold"
                          >
                            {sz}
                          </button>
                        ))}
                      </div>
                    </div>
                  </div>

                  <div className="mt-6 pt-4 border-t border-white/10 flex flex-col gap-2">
                    <button
                      onClick={() => {
                        addToCart(quickViewProduct);
                        setQuickViewProduct(null);
                      }}
                      className="w-full bg-brand-yellow hover:bg-yellow-400 text-black font-extrabold py-3 text-xs uppercase tracking-wider rounded"
                    >
                      Add To Shopping Bag
                    </button>
                    <button
                      onClick={() => openWhatsAppOrder(quickViewProduct)}
                      className="w-full bg-brand-green hover:bg-emerald-600 text-black font-bold py-2.5 text-xs rounded flex items-center justify-center gap-2"
                    >
                      <Icon.WhatsApp className="w-4 h-4 fill-black" />
                      Order Directly on WhatsApp
                    </button>
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* Cart Slide-over */}
          {cartOpen && (
            <div className="fixed inset-0 z-50 overflow-hidden">
              <div className="absolute inset-0 bg-black/80 backdrop-blur-sm" onClick={() => setCartOpen(false)} />
              
              <div className="fixed inset-y-0 right-0 max-w-full flex pl-10">
                <div className="w-screen max-w-md bg-dark-900 border-l border-white/10 shadow-2xl flex flex-col justify-between">
                  
                  <div className="p-6 border-b border-white/10 flex items-center justify-between">
                    <div>
                      <h3 className="text-xl font-black font-heading text-white">Your Shopping Bag</h3>
                      <p className="text-xs text-neutral-400">{cartItemsCount} item(s)</p>
                    </div>
                    <button onClick={() => setCartOpen(false)} className="text-neutral-400 hover:text-white">
                      <Icon.Close className="w-5 h-5" />
                    </button>
                  </div>

                  <div className="flex-1 overflow-y-auto p-6 space-y-4">
                    {cart.length === 0 ? (
                      <div className="text-center py-20 text-neutral-400 text-xs">
                        Your bag is currently empty.
                      </div>
                    ) : (
                      cart.map((item, idx) => (
                        <div key={idx} className="flex gap-4 pb-4 border-b border-white/5">
                          <img src={item.product.images[0]} alt="" className="w-16 h-20 object-cover rounded" />
                          <div className="flex-1 flex flex-col justify-between">
                            <div>
                              <div className="flex justify-between items-start">
                                <h4 className="text-sm font-bold text-white line-clamp-1">{item.product.name}</h4>
                                <button onClick={() => updateQty(idx, -item.qty)} className="text-neutral-500 hover:text-red-400">
                                  <Icon.Close className="w-3.5 h-3.5" />
                                </button>
                              </div>
                              <p className="text-[11px] text-neutral-400">Size: <strong className="text-white">{item.size}</strong></p>
                            </div>
                            <div className="flex items-center justify-between">
                              <div className="flex items-center border border-neutral-700 rounded text-xs">
                                <button onClick={() => updateQty(idx, -1)} className="px-2 py-0.5 text-neutral-400">-</button>
                                <span className="px-2 text-white font-bold">{item.qty}</span>
                                <button onClick={() => updateQty(idx, 1)} className="px-2 py-0.5 text-neutral-400">+</button>
                              </div>
                              <span className="text-sm font-bold text-brand-yellow">₹{item.product.price * item.qty}</span>
                            </div>
                          </div>
                        </div>
                      ))
                    )}
                  </div>

                  {cart.length > 0 && (
                    <div className="p-6 bg-dark-950 border-t border-white/10 space-y-4">
                      <div className="flex justify-between text-base font-extrabold text-white">
                        <span>Total Payable</span>
                        <span className="text-brand-yellow text-lg">₹{cartTotal}</span>
                      </div>

                      {/* Instant WhatsApp Order Button */}
                      <button
                        onClick={() => openWhatsAppOrder(cart)}
                        className="w-full bg-brand-green hover:bg-emerald-600 text-black font-extrabold py-3 text-xs uppercase tracking-wider rounded flex items-center justify-center gap-2 shadow-lg"
                      >
                        <Icon.WhatsApp className="w-4 h-4 fill-black" />
                        Send Order to WhatsApp (Instant)
                      </button>

                      <p className="text-[10px] text-center text-neutral-500">
                        Orders confirmed on WhatsApp • Pan-India Courier Delivery
                      </p>
                    </div>
                  )}

                </div>
              </div>
            </div>
          )}

          {/* Footer with Store Address & Socials */}
          <footer className="bg-dark-950 border-t border-white/10 mt-auto">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 py-12 grid grid-cols-1 md:grid-cols-3 gap-8">
              
              <div>
                <span className="font-extrabold text-2xl tracking-tighter text-white font-heading block">
                  AURA<span className="text-brand-yellow">.</span>OUTFIT
                </span>
                <p className="text-xs text-neutral-400 mt-2 font-light leading-relaxed">
                  Export quality menswear, baggy pants, Korean shirts, and combo deals. Direct from our Salem storefront to all over India.
                </p>
                <div className="mt-4 flex items-center gap-4">
                  <a href={INSTAGRAM_URL} target="_blank" rel="noreferrer" className="text-pink-400 hover:text-pink-300">
                    <Icon.Instagram className="w-5 h-5" />
                  </a>
                  <a href={`https://wa.me/${WHATSAPP_PHONE}`} target="_blank" rel="noreferrer" className="text-green-400 hover:text-green-300">
                    <Icon.WhatsApp className="w-5 h-5" />
                  </a>
                </div>
              </div>

              <div>
                <h4 className="text-xs font-black uppercase text-white tracking-widest mb-3">Physical Store Location</h4>
                <p className="text-xs text-neutral-400 leading-relaxed">
                  <strong className="text-neutral-200">AURA OUTFIT</strong><br />
                  Near Bus Stop, Puthira Goundan Palayam (PG Palayam),<br />
                  Salem District, Tamil Nadu — 636119.<br />
                  <span className="text-brand-yellow font-semibold mt-1 block">WhatsApp / Phone: +91 93605 53223</span>
                </p>
              </div>

              <div>
                <h4 className="text-xs font-black uppercase text-white tracking-widest mb-3">Customer Service & Dispatch</h4>
                <ul className="text-xs text-neutral-400 space-y-1.5">
                  <li>• Pan-India Courier Dispatch (2-4 business days)</li>
                  <li>• Cash On Delivery (COD) Available</li>
                  <li>• DM on Instagram <strong className="text-pink-400">@aura_outfit._</strong> for sizing questions</li>
                  <li>• WhatsApp Customer Care: 93605 53223</li>
                </ul>
              </div>

            </div>

            <div className="border-t border-white/5 py-6 text-center text-xs text-neutral-500">
              © 2026 AURA OUTFIT (@aura_outfit._). All rights reserved. Made for Tamil Nadu & All-India Fashion.
            </div>
          </footer>

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
